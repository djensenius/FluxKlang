      - path: FluxKlangTests/PeerSyncTests+Commands.swift
      - path: FluxKlangTests/PeerTrustTests.swift
      - path: FluxKlangTests/PeerTrustTests+Pairing.swift
      - path: FluxKlangTests/PeerTrustTests+Storage.swift
      - path: FluxKlangTests/PeerTrustTests+Vectors.swift
      - path: FluxKlangTests/ControlPickupTests.swift
      - path: FluxKlangTests/ControlHostTruthTests.swift
