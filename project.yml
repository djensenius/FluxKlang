name: FluxKlang
options:
  bundleIdPrefix: org.davidjensenius
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6"
    DEVELOPMENT_TEAM: 9JALHNGRBQ
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "5"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  swift-osc:
    url: https://github.com/orchetect/swift-osc
    from: "3.1.0"

targets:
  FluxKlang:
    type: application
    platform: iOS
    sources:
      - path: FluxKlang
        excludes: ["**/.DS_Store"]
      - path: Shared
        excludes: ["**/.DS_Store"]
    info:
      path: FluxKlang/Info.plist
      properties:
        CFBundleDisplayName: FluxKlang
        CFBundleName: FluxKlang
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.music
        NSLocalNetworkUsageDescription: "FluxKlang uses the local network to connect to and control your WING console. It connects only when you choose a console, or to reconnect to one you already connected to on this device."
        NSMicrophoneUsageDescription: "FluxKlang uses audio input only when you turn on a feature that listens to a microphone or audio interface input."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.FluxKlang
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: FluxKlang/FluxKlang.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        com.apple.developer.icloud-container-identifiers:
          - iCloud.org.davidjensenius.FluxKlang
        com.apple.developer.icloud-services:
          - CloudKit
    dependencies:
      - package: swift-osc
        product: SwiftOSC

  FluxKlangMac:
    type: application
    platform: macOS
    sources:
      - path: FluxKlangMac
        excludes: ["**/.DS_Store"]
      - path: Shared
        excludes: ["**/.DS_Store"]
    info:
      path: FluxKlangMac/Info.plist
      properties:
        CFBundleDisplayName: FluxKlang
        CFBundleName: FluxKlangMac
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.music
        NSLocalNetworkUsageDescription: "FluxKlang uses the local network to connect to and control your WING console. It connects only when you choose a console, or to reconnect to one you already connected to on this device."
        NSMicrophoneUsageDescription: "FluxKlang uses audio input only when you turn on a feature that listens to a microphone or audio interface input."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.FluxKlang
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: true
        ENABLE_APP_SANDBOX: true
        ENABLE_INCOMING_NETWORK_CONNECTIONS: true
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: true
        COMBINE_HIDPI_IMAGES: true
    entitlements:
      path: FluxKlangMac/FluxKlangMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.microphone: true
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        com.apple.developer.icloud-container-identifiers:
          - iCloud.org.davidjensenius.FluxKlang
        com.apple.developer.icloud-services:
          - CloudKit
    dependencies:
      - package: swift-osc
        product: SwiftOSC

  FluxKlangTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FluxKlangTests
        excludes: ["**/.DS_Store"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.FluxKlang.tests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: FluxKlang
        embed: false

  FluxKlangUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FluxKlangUITests
        excludes: ["**/.DS_Store"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.FluxKlang.uitests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: FluxKlang

  FluxKlangMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FluxKlangMacTests
        excludes: ["**/.DS_Store"]
      # Platform-neutral helper shared with FluxKlangTests; it must not import an app module.
      - path: FluxKlangTests/TestSupport.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.FluxKlang.mactests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: FluxKlangMac
        embed: false

schemes:
  FluxKlang:
    build:
      targets:
        FluxKlang: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FluxKlangTests
        - FluxKlangUITests
    profile:
      config: Release
    analyze:
      config: Debug

  FluxKlangMac:
    build:
      targets:
        FluxKlangMac: all
    run:
      config: Debug
    # Hosted: FluxKlangMac.app is the test host. Execution is gated by #60 (startup isolation #51).
    test:
      config: Debug
      targets:
        - FluxKlangMacTests
    profile:
      config: Release
    analyze:
      config: Debug
