name: FluxKlang
options:
  bundleIdPrefix: org.davidjensenius
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6"
    DEVELOPMENT_TEAM: 9JALHNGRBQ
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  swift-osc:
    url: https://github.com/orchetect/swift-osc
    from: "3.1.0"

targets:
  FluxKlang:
    type: application
    platform: iOS
    sources:
      - path: FluxKlang
        excludes: ["**/.DS_Store"]
      - path: Shared
        excludes: ["**/.DS_Store"]
      - path: Icons/AppIcon.icon
        buildPhase: resources
    info:
      path: FluxKlang/Info.plist
      properties:
        CFBundleDisplayName: FluxKlang
        CFBundleName: FluxKlang
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.music
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.FluxKlang
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: FluxKlang/FluxKlang.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    dependencies:
      - package: swift-osc
        product: SwiftOSC

  FluxKlangMac:
    type: application
    platform: macOS
    sources:
      - path: FluxKlangMac
        excludes: ["**/.DS_Store"]
      - path: Shared
        excludes: ["**/.DS_Store"]
      - path: Icons/AppIcon.icon
        buildPhase: resources
    info:
      path: FluxKlangMac/Info.plist
      properties:
        CFBundleDisplayName: FluxKlang
        CFBundleName: FluxKlangMac
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.music
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.FluxKlang
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: true
        ENABLE_APP_SANDBOX: true
        ENABLE_INCOMING_NETWORK_CONNECTIONS: true
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: true
        COMBINE_HIDPI_IMAGES: true
    entitlements:
      path: FluxKlangMac/FluxKlangMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    dependencies:
      - package: swift-osc
        product: SwiftOSC

  FluxKlangTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FluxKlangTests
        excludes: ["**/.DS_Store"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.davidjensenius.FluxKlang.tests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: FluxKlang
        embed: false

schemes:
  FluxKlang:
    build:
      targets:
        FluxKlang: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FluxKlangTests
    profile:
      config: Release
    analyze:
      config: Debug

  FluxKlangMac:
    build:
      targets:
        FluxKlangMac: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
