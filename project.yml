        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: FluxKlangMac
        embed: false

schemes:
  FluxKlang:
    build:
      targets:
        FluxKlang: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FluxKlangTests
        - FluxKlangUITests
    profile:
      config: Release
    analyze:
      config: Debug

  FluxKlangMac:
    build:
      targets:
        FluxKlangMac: all
    run:
      config: Debug
    # Hosted: FluxKlangMac.app is the test host. Execution is gated by #60 (startup isolation #51).
    test:
      config: Debug
      targets:
        - FluxKlangMacTests
    profile:
      config: Release
    analyze:
      config: Debug

  # Dedicated Test actions keep audited runs separate from Apple qualification.
  FluxKlangIsolatedTests:
    build:
      targets:
        FluxKlang: all
    test:
      config: Debug
      environmentVariables:
        FLUXKLANG_ISOLATED_TESTING: "1"
        FLUXKLANG_RUN_APPLE_MODEL_TESTS: "0"
        FLUXKLANG_QUALIFY_APPLE_ROUTING: "0"
      targets:
        - FluxKlangTests
        - FluxKlangUITests

  FluxKlangMacIsolatedTests:
    build:
      targets:
        FluxKlangMac: all
    test:
      config: Debug
      environmentVariables:
        FLUXKLANG_ISOLATED_TESTING: "1"
        FLUXKLANG_RUN_APPLE_MODEL_TESTS: "0"
        FLUXKLANG_QUALIFY_APPLE_ROUTING: "0"
      targets:
        - FluxKlangMacTests

  # Separate opt-in qualification; fresh-host execution remains independently gated.
  FluxKlangAppleQualification:
    build:
      targets:
        FluxKlang: all
    test:
      config: Debug
      environmentVariables:
        FLUXKLANG_ISOLATED_TESTING: "0"
        FLUXKLANG_RUN_APPLE_MODEL_TESTS: "1"
        FLUXKLANG_QUALIFY_APPLE_ROUTING: "1"
      targets:
        - FluxKlangAppleQualificationTests
