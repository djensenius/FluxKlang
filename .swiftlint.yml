excluded:
  - .build
  - DerivedData
  - build
type_body_length: 400
file_length: 500
function_body_length: 100
identifier_name:
  excluded:
    - id
    - to
custom_rules:
  fault_latch_test_seams:
    name: FaultLatch test seams
    regex: '(?<!func )(?<!func `)\b(?:admitRaiseForTesting|finishRaiseForTesting|addRaiseForTesting|publishRaiseForTesting|withControlLockForTesting|seedForTesting|stateForTesting|seedUnknownScopeFaultsForTesting)\b'
    match_kinds:
      - identifier
    message: FaultLatch seams are restricted to root tests.
    severity: error
  fault_latch_raw_raise:
    name: FaultLatch raw raise
    regex: '(?<=\.)raise(?=\s*\((?!\s*&))'
    match_kinds:
      - identifier
    message: Production code raises faults through a FaultChainAuthority token (`raise(&token, ...)`), not FaultLatch.raise.
    severity: error
  fault_latch_authority_raise:
    name: FaultLatch authority raise
    regex: '(?<=\.)raise(?=\s*\(\s*&)'
    match_kinds:
      - identifier
    # The allowlist: the four lane owners. Add a file only with review.
    excluded:
      - /Shared/Audio/Kernel/Memory/DeferredRelease\.swift$
      - /Shared/Audio/Kernel/Memory/ReservedCapacityRing\+Chains\.swift$
      - /Shared/Audio/Kernel/Memory/FanInHandoff\+Chains\.swift$
      - /Shared/Audio/Kernel/Events/SysExAssembler\.swift$
    message: Authority raises (`raise(&token, ...)`) are restricted to the lane-owner files allowlisted in .swiftlint.yml.
    severity: error
