name: Hosted checkout layout census (no acceptance)

on:
  workflow_dispatch:
    inputs:
      census_version:
        description: Aggregate census version (not acceptance)
        type: choice
        options:
          - v1
          - v2
        default: v1
        required: true

permissions:
  contents: read

jobs:
  layout:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 (peeled commit)
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Observe checkout layout only (v1)
        if: ${{ inputs.census_version == 'v1' }}
        run: python3 -B scripts/test-audit-run/hosted_layout_census.py

      - name: Observe checkout layout only (v2)
        if: ${{ inputs.census_version == 'v2' }}
        run: python3 -B scripts/test-audit-run/hosted_layout_census_v2.py
