name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swiftlint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint --strict
      - name: Hardware inventory self-check
        run: bash scripts/hardware-inventory/passive-inventory.sh --self-check --require-symbols
