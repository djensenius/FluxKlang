name: Mac isolated observation

# One sealed hosted FluxKlangMacIsolatedTests audit observation (#693; part of #60).
# An observation, not qualification of #60: see scripts/test-audit-run/README.md.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/mac-isolated-observation.yml
      - scripts/test-audit-run/**

permissions:
  contents: read

concurrency:
  group: mac-isolated-observation-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  observe:
    # Same preview image and Xcode as apple-build.yml; no fallback to older images.
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25
          install_args: xcodegen
      - name: Pinned XcodeGen is on PATH
        run: |
          command -v xcodegen >/dev/null || { echo "::error::xcodegen is not on PATH"; exit 1; }
          want=$(mise current xcodegen) || { echo "::error::mise current xcodegen failed"; exit 1; }
          have=$(xcodegen --version) || { echo "::error::xcodegen --version failed"; exit 1; }
          echo "$have at $(command -v xcodegen); mise.toml pins $want"
          if [ -z "$want" ] || [ "$have" != "Version: $want" ]; then
            echo "::error::xcodegen '$have' is not the mise.toml pin '$want'"; exit 1
          fi
      - name: Record environment
        id: env
        env:
          # Empty on workflow_dispatch; on pull_request HEAD/GITHUB_SHA are the merge commit.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # prepare.py needs Python >= 3.7 (argparse subparsers `required`); the runner's python3 is used.
        run: |
          [ -x "$DEVELOPER_DIR/usr/bin/xcodebuild" ] || { ls -d /Applications/Xcode*.app || true; echo "::error::$DEVELOPER_DIR missing on this image (no fallback)"; exit 1; }
          head_sha=$(git rev-parse HEAD)
          pr_head_sha=${PR_HEAD_SHA:-not applicable}
          case $pr_head_sha in
            "not applicable") ;;
            *) [[ $pr_head_sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error::unexpected PR head SHA '$pr_head_sha'"; exit 1; } ;;
          esac
          xcode=$(xcodebuild -version | tr '\n' ' ')
          macos="$(sw_vers -productVersion) ($(sw_vers -buildVersion))"
          python=$(python3 --version 2>&1)
          echo "python3 at $(command -v python3): $python"
          if ! python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 7) else 1)'; then
            echo "::error::$python is older than the Python 3.7 that prepare.py requires"; exit 1
          fi
          {
            echo "head_sha=$head_sha"
            echo "pr_head_sha=$pr_head_sha"
            echo "xcode=$xcode"
            echo "macos=$macos"
            echo "python=$python"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Environment"
            echo
            echo "- HEAD: \`$head_sha\` (event SHA \`$GITHUB_SHA\`; the merge commit on pull requests)"
            echo "- PR head: \`$pr_head_sha\`"
            echo "- Xcode: $xcode"
            echo "- macOS: $macos"
            echo "- Python: $python"
            echo "- Installed Xcodes:"
            for app in /Applications/Xcode*.app; do echo "  - \`$app\`"; done
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Require OS-27 macOS SDK
        run: |
          v=$(xcrun --sdk macosx --show-sdk-version)
          echo "macosx SDK $v"
          case $v in [0-9]*) ;; *) echo "::error::macosx SDK version '$v' unparseable"; exit 1 ;; esac
          [ "${v%%.*}" -ge 27 ] || { echo "::error::macosx SDK $v < 27.0 (no deployment downgrade)"; exit 1; }
      - name: Generated project is in sync
        run: |
          xcodegen generate
          git status --porcelain --untracked-files=all
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git --no-pager diff --stat
            echo "::error::xcodegen generate changed the tree; commit the regenerated project"; exit 1
          fi
      - name: Resolve packages from committed pins
        run: |
          xcodebuild -project FluxKlang.xcodeproj -scheme FluxKlangMacIsolatedTests -resolvePackageDependencies \
            -disableAutomaticPackageResolution -derivedDataPath "$RUNNER_TEMP/dd"
          git --no-pager diff --exit-code -- '*Package.resolved'
          if [ -n "$(git status --porcelain --untracked-files=all -- '*Package.resolved')" ]; then
            git status --porcelain --untracked-files=all -- '*Package.resolved'
            echo "::error::package resolution changed or added a Package.resolved"; exit 1
          fi
      - name: Build macOS for testing
        # CODE_SIGNING_ALLOWED=NO (as `make test-mac`): the linker ad-hoc signs without entitlements,
        # so the host runs unsandboxed. An ad-hoc `-` identity would embed iCloud entitlements and fail to launch.
        run: |
          xcodebuild build-for-testing -project FluxKlang.xcodeproj -scheme FluxKlangMacIsolatedTests \
            -destination 'platform=macOS,arch=arm64' \
            -disableAutomaticPackageResolution -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO
          {
            echo "## Build"
            echo
            echo "- Deviation: built with \`CODE_SIGNING_ALLOWED=NO\`; the host is linker ad-hoc signed without"
            echo "  entitlements and runs unsandboxed (no team signing, no iCloud/CloudKit entitlements)."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Pin the generated xctestrun
        id: pin
        # A CI-computed pin, not an independently reviewed one: computed once here from the fresh
        # build, it binds only build -> prepare -> validate within this run. Never recomputed after a refusal.
        run: |
          products="$RUNNER_TEMP/dd/Build/Products"
          found=()
          while IFS= read -r -d '' f; do found+=("$f"); done \
            < <(find "$products" -name '*.xctestrun' -print0)
          if [ "${#found[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .xctestrun under $products, found ${#found[@]}"
            printf '%s\n' ${found[@]+"${found[@]}"}
            exit 1
          fi
          xctestrun=${found[0]}
          case $xctestrun in *$'\n'* | *$'\r'*) echo "::error::xctestrun path contains a line break"; exit 1 ;; esac
          [ -f "$xctestrun" ] && [ ! -L "$xctestrun" ] || { echo "::error::$xctestrun is not a regular file"; exit 1; }
          sha=$(shasum -a 256 "$xctestrun" | awk '{ print $1 }')
          [[ $sha =~ ^[0-9a-f]{64}$ ]] || { echo "::error::unexpected sha256 '$sha'"; exit 1; }
          plutil -p "$xctestrun"
          echo "xctestrun=$xctestrun"
          echo "sha256=$sha"
          { echo "xctestrun=$xctestrun"; echo "sha256=$sha"; } >> "$GITHUB_OUTPUT"
          {
            echo "## Pin"
            echo
            echo "- xctestrun: \`$xctestrun\`"
            echo "- sha256: \`$sha\` (CI-computed once, not independently reviewed; binds build, prepare and validate in this run only; never recomputed after a refusal)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare and validate (mac-isolated-unit)
        id: prepare
        env:
          XCTESTRUN: ${{ steps.pin.outputs.xctestrun }}
          XCTESTRUN_SHA256: ${{ steps.pin.outputs.sha256 }}
        # A refusal is a recorded observation result: no repair, no retry.
        run: |
          refused() {
            local phase=$1 status=$2 stderr_file=$3
            {
              echo "## Preparation refused"
              echo
              echo "- Phase: \`$phase\`; exit status $status"
              echo
              echo '```text'
              head -c 4000 "$stderr_file" | tr '\140' "'"
              echo
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::prepare.py $phase refused (exit $status)"
            exit 1
          }
          work="$RUNNER_TEMP/prepare"
          mkdir -m 700 "$work"
          status=0
          python3 scripts/test-audit-run/prepare.py prepare \
            --input "$XCTESTRUN" --expected-sha256 "$XCTESTRUN_SHA256" --profile mac-isolated-unit \
            > "$work/prepare.json" 2> "$work/prepare.err" || status=$?
          cat "$work/prepare.err" >&2
          [ "$status" -eq 0 ] || refused prepare "$status" "$work/prepare.err"
          cat "$work/prepare.json"
          fields=$(python3 -c '
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["status"] == "prepared"
          i = d["intent"]
          values = (i["run_id"], i["output"]["path"], i["intent_path"])
          assert all(isinstance(v, str) and v and not any(c in v for c in "\t\r\n") for v in values)
          print("\t".join(values))
          ' "$work/prepare.json") || { echo "::error::could not parse prepare.json"; exit 1; }
          IFS=$'\t' read -r run_id output intent <<< "$fields"
          [ -n "$run_id" ] && [ -n "$output" ] && [ -n "$intent" ] \
            || { echo "::error::prepare.json has an empty run ID, output or intent"; exit 1; }
          [[ $run_id =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] \
            || { echo "::error::unexpected run ID '$run_id'"; exit 1; }
          case $output in /*.xctestrun) ;; *) echo "::error::unexpected output '$output'"; exit 1 ;; esac
          case $intent in /*.intent.json) ;; *) echo "::error::unexpected intent '$intent'"; exit 1 ;; esac
          status=0
          python3 scripts/test-audit-run/prepare.py validate \
            --input "$XCTESTRUN" --expected-sha256 "$XCTESTRUN_SHA256" --profile mac-isolated-unit \
            --output "$output" --intent "$intent" \
            > "$work/validate.json" 2> "$work/validate.err" || status=$?
          cat "$work/validate.err" >&2
          [ "$status" -eq 0 ] || refused validate "$status" "$work/validate.err"
          python3 -c '
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["status"] == "validated" and d["intent"]["run_id"] == sys.argv[2], "validation mismatch"
          ' "$work/validate.json" "$run_id" || { echo "::error::could not parse or match validate.json"; exit 1; }
          { echo "run_id=$run_id"; echo "output=$output"; echo "intent=$intent"; } >> "$GITHUB_OUTPUT"
          {
            echo "## Preparation"
            echo
            echo "- Profile: \`mac-isolated-unit\`; prepare and validate exited 0"
            echo "- Run ID: \`$run_id\`"
            echo "- Prepared xctestrun: \`$output\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create the receipt directory
        id: receipts
        env:
          RUN_ID: ${{ steps.prepare.outputs.run_id }}
        # Fresh, owned, 0700, real directory; refuse before launch otherwise (#652, #659).
        run: |
          dir="$RUNNER_TEMP/audit-receipts-$RUN_ID"
          case $dir in *$'\n'* | *$'\r'*) echo "::error::receipt directory path contains a line break"; exit 1 ;; esac
          case $dir in
            /*) ;;
            *) echo "::error::receipt directory '$dir' is not absolute"; exit 1 ;;
          esac
          case $dir in
            */ | */. | */..) echo "::error::receipt directory '$dir' has a trailing /, /. or /.."; exit 1 ;;
          esac
          [ ! -e "$dir" ] && [ ! -L "$dir" ] || { echo "::error::receipt directory '$dir' already exists"; exit 1; }
          mkdir -m 700 "$dir"
          [ -d "$dir" ] && [ ! -L "$dir" ] || { echo "::error::'$dir' is not a real directory"; exit 1; }
          owner=$(/usr/bin/stat -f %u "$dir"); mode=$(/usr/bin/stat -f %Lp "$dir")
          [ "$owner" = "$(id -u)" ] || { echo "::error::'$dir' owned by uid $owner, not $(id -u)"; exit 1; }
          [ "$mode" = "700" ] || { echo "::error::'$dir' has mode $mode, not 700"; exit 1; }
          [ -z "$(ls -A "$dir")" ] || { echo "::error::'$dir' is not empty"; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          {
            echo "## Receipt directory"
            echo
            echo "- Fresh 0700 directory supplied as \`TEST_RUNNER_FLUXKLANG_AUDIT_RECEIPT_DIR\`."
            echo "- Deviation: the README expects the key in xctestrun \`EnvironmentVariables\`, but the closed"
            echo "  profile adds only \`FLUXKLANG_AUDIT_RUN_ID\` and the prepared output is not modified."
            echo "  Delivery via the \`TEST_RUNNER_\` prefix is unverified; a missing key is a known trap path."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run the observation once
        id: test
        # Bounded so a hung host still leaves time for the always-run summary and upload.
        timeout-minutes: 60
        env:
          PREPARED_XCTESTRUN: ${{ steps.prepare.outputs.output }}
          TEST_RUNNER_FLUXKLANG_AUDIT_RECEIPT_DIR: ${{ steps.receipts.outputs.dir }}
        # Exactly one invocation, aligned with the README's candidate argv (#294) minus
        # -derivedDataPath and -test-iterations 1 (an actual Xcode 27.2 run rejected it with exit 64
        # before any test ran): no retries, filters or other parallel-testing/iteration overrides.
        run: |
          [ -n "$TEST_RUNNER_FLUXKLANG_AUDIT_RECEIPT_DIR" ] && [ -d "$TEST_RUNNER_FLUXKLANG_AUDIT_RECEIPT_DIR" ] \
            || { echo "::error::receipt directory missing; refusing to launch"; exit 1; }
          argv=("$DEVELOPER_DIR/usr/bin/xcodebuild"
            test-without-building -xctestrun "$PREPARED_XCTESTRUN"
            -destination 'platform=macOS,arch=arm64'
            -parallel-testing-enabled NO
            -resultBundlePath "$RUNNER_TEMP/observation.xcresult")
          argv_text=$(printf '%q ' "${argv[@]}"); argv_text=${argv_text% }
          case $argv_text in *$'\n'* | *$'\r'*) echo "::error::argv contains a line break"; exit 1 ;; esac
          echo "argv: $argv_text"
          start=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          { echo "argv=$argv_text"; echo "start=$start"; } >> "$GITHUB_OUTPUT"
          set +e
          "${argv[@]}"
          status=$?
          set -e
          end=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          { echo "end=$end"; echo "status=$status"; } >> "$GITHUB_OUTPUT"
          echo "xcodebuild test-without-building exited $status ($start .. $end)"
      - name: Summarize the observation
        if: always()
        env:
          HEAD_SHA: ${{ steps.env.outputs.head_sha }}
          PR_HEAD_SHA: ${{ steps.env.outputs.pr_head_sha }}
          XCODE: ${{ steps.env.outputs.xcode }}
          MACOS: ${{ steps.env.outputs.macos }}
          PYTHON: ${{ steps.env.outputs.python }}
          XCTESTRUN: ${{ steps.pin.outputs.xctestrun }}
          XCTESTRUN_SHA256: ${{ steps.pin.outputs.sha256 }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          RUN_ID: ${{ steps.prepare.outputs.run_id }}
          RECEIPT_DIR: ${{ steps.receipts.outputs.dir }}
          TEST_START: ${{ steps.test.outputs.start }}
          TEST_END: ${{ steps.test.outputs.end }}
          TEST_STATUS: ${{ steps.test.outputs.status }}
          TEST_ARGV: ${{ steps.test.outputs.argv }}
          RESULT_BUNDLE: ${{ runner.temp }}/observation.xcresult
          SUMMARY_DIR: ${{ runner.temp }}/observation-summary
        # Counts and redacted, trimmed failure text only; receipt contents and filenames are never
        # written (scripts/test-audit-run/observation_summary.py redacts before truncating).
        run: |
          mkdir -p "$SUMMARY_DIR"
          python3 scripts/test-audit-run/observation_summary.py
      - name: Upload the summary only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-isolated-observation-summary-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/observation-summary/summary.json
            ${{ runner.temp }}/observation-summary/summary.md
          if-no-files-found: error
          retention-days: 14
      - name: Fail on a non-zero test exit code
        env:
          TEST_STATUS: ${{ steps.test.outputs.status }}
        run: |
          [ "$TEST_STATUS" = "0" ] || { echo "::error::xcodebuild test-without-building exited '$TEST_STATUS'"; exit 1; }
